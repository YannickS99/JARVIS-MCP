spring:
  application:
    name: jarvis-mcp

  # Jede Anfrage laeuft auf einem virtuellen Thread. Die Werkzeuge verbringen ihre Zeit fast
  # ausschliesslich wartend auf Home Assistant - genau der Fall, fuer den virtuelle Threads da
  # sind: Ein wartender Aufruf belegt keinen Betriebssystem-Thread mehr, und der Server bleibt
  # auch dann antwortbereit, wenn Home Assistant traege ist.
  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        name: jarvis-mcp
        # Wird beim Bauen aus der pom.xml eingesetzt - release.sh bumpt damit auch die Version,
        # die der MCP-Client beim Handshake zu sehen bekommt.
        version: '@project.version@'
        # Streamable HTTP ist der aktuelle MCP-Transport und loest HTTP+SSE ab: kein dauerhaft
        # offener Kanal noetig, der Normalfall ist ein schlichter Request/Response-Zyklus.
        protocol: streamable
        type: sync
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          # Resources liefern die ansprechbaren Namen (Bereiche, Lichter, Routinen, Anwendungen) an
          # den semantischen Cache des JARVIS-AIService - siehe common/EntityCatalog.
          resource: true
          # Prompts und Vervollstaendigung bietet dieser Server (noch) nicht an. Sie abzuschalten
          # haelt den Handshake und die Faehigkeitsliste klein.
          prompt: false
          completion: false
        # Knapp gehalten: Ein haengender Aufruf soll als Fehler zurueckkommen, solange der Nutzer
        # noch auf eine gesprochene Antwort wartet.
        request-timeout: 20s
        instructions: >
          Werkzeuge fuer das Zuhause von JARVIS. Ueber sie lassen sich Lichter einzeln oder
          raumweise schalten, in Home Assistant hinterlegte Routinen (Szenen und Skripte)
          ausloesen und abfragen, welche Lichter gerade an sind. Dazu kommen die Anwendungen
          auf dem Server selbst: abfragen, wie es ihnen geht und ob etwas ausgefallen ist,
          und sie unter ihrem Anwendungsnamen starten bzw. stoppen. Ist der Obsidian-Vault
          angebunden, kommen Werkzeuge fuer Yannicks Notizen dazu: suchen, lesen, neue
          anlegen, ergaenzen und einzelne Abschnitte ueberarbeiten.

server:
  port: ${SERVER_PORT:8098}
  shutdown: graceful

management:
  # Eigener Port fuer den Health-Endpunkt, damit das Monitoring Tool ihn ohne Token erreicht,
  # waehrend der MCP-Endpunkt geschuetzt bleibt - dasselbe Muster wie beim JARVIS-AIService.
  server:
    port: ${MANAGEMENT_PORT:8099}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    build:
      enabled: true

jarvis-mcp:
  auth:
    # Geteiltes Geheimnis mit dem JARVIS-AIService. Leer bedeutet: keine Pruefung (mit deutlicher
    # Warnung beim Start).
    token: ${JARVIS_MCP_AUTH_TOKEN:}

  home-assistant:
    enabled: ${HA_ENABLED:true}
    # Home Assistant laeuft auf JARVIS im Host-Netz auf Port 8123; aus einem Bridge-Container
    # heraus ist der Host ueber host.docker.internal erreichbar.
    base-url: ${HA_BASE_URL:}
    # Long-Lived Access Token aus dem Home-Assistant-Profil.
    token: ${HA_TOKEN:}
    connect-timeout: ${HA_CONNECT_TIMEOUT:2s}
    read-timeout: ${HA_READ_TIMEOUT:5s}
    # Takt, in dem der Entitaeten-Index im Hintergrund erneuert wird. Ein Werkzeugaufruf trifft
    # damit fast immer einen warmen Index und kostet keinen Home-Assistant-Abruf.
    cache-ttl: ${HA_CACHE_TTL:60s}
    min-refresh-interval: ${HA_MIN_REFRESH_INTERVAL:5s}
    # Zusaetzliche Namen fuer einzelne Bereiche. Normalerweise leer: Die Bereiche kommen aus
    # Home Assistant selbst (ueber dessen Template-Engine). Ein Eintrag ist nur noetig, wenn ein
    # Bereich anders angesprochen werden soll, als er dort heisst - Home Assistants eigene
    # Bereichsaliasse gibt keine REST-Schnittstelle heraus. Gepflegt wird das im Betrieb ueber
    # config/application.yaml neben dem Jar.
    areas: []

  monitoring:
    enabled: ${MONITORING_ENABLED:true}
    # Das Monitoring-Backend veroeffentlicht auf dem Host bewusst nur auf 127.0.0.1 - aus einem
    # Bridge-Container ist es damit ueber host.docker.internal nicht erreichbar. JARVIS-MCP haengt
    # sich stattdessen an das gemeinsame Netz jarvis-net (siehe docker-compose.yml) und spricht den
    # Container direkt an. Eine Freigabe des Hostports waere die naheliegende, aber falsche
    # Alternative: Sie wuerde auch /api/v1 ins Netz stellen, und das ist ungeschuetzt.
    base-url: ${MONITORING_BASE_URL:http://monitoring-backend:8080}
    # Geteiltes Geheimnis mit dem Monitoring Tool - dort MONITORING_INTEGRATION_TOKEN.
    token: ${MONITORING_TOKEN:}
    connect-timeout: ${MONITORING_CONNECT_TIMEOUT:2s}
    # Groesser als bei Home Assistant: Ein Container-Start wartet auf die Docker Engine.
    read-timeout: ${MONITORING_READ_TIMEOUT:10s}

  obsidian:
    # Vorgabe aus, anders als bei den uebrigen Modulen: Ohne eingehaengten Vault-Ordner wuerde
    # jedes Werkzeug scheitern, und die KI soll Werkzeuge gar nicht erst sehen, die es auf dieser
    # Maschine nicht gibt.
    enabled: ${OBSIDIAN_ENABLED:false}
    # Der Ordner aus Sicht des Containers. Die docker-compose.yml haengt dorthin nur den
    # freigegebenen Teil des Vaults ein - der Rest existiert hier gar nicht.
    root: ${OBSIDIAN_ROOT:/srv/vault}
    # Schreibende Werkzeuge anbieten. Aus bedeutet: JARVIS darf den Vault lesen, aber nicht
    # aendern - die Werkzeuge dafuer tauchen dann nicht einmal in tools/list auf.
    writable: ${OBSIDIAN_WRITABLE:true}
    # Obergrenze fuer den Text einer gelesenen Notiz; sie landet im Kontextfenster des Modells.
    max-note-chars: ${OBSIDIAN_MAX_NOTE_CHARS:60000}
    max-results: ${OBSIDIAN_MAX_RESULTS:40}
    snippet-chars: ${OBSIDIAN_SNIPPET_CHARS:240}

logging:
  level:
    root: INFO
    io.github.yannicks99.jarvis_mcp: ${JARVIS_MCP_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %-40.40logger{39} : %msg%n"
