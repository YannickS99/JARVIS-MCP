# Betriebskonfiguration, die neben dem Jar liegt statt darin.
#
# Spring Boot liest diese Datei automatisch aus dem Ordner "config" neben der Anwendung und legt
# ihre Werte ueber die in application.yaml eingebauten. Im Container wird der Ordner
# hineingemountet (siehe docker-compose.yml) - eine Aenderung braucht damit nur einen Neustart des
# Containers, kein neues Image.

jarvis-mcp:
  home-assistant:
    # Die Bereiche aus Home Assistant und die Namen, unter denen sie angesprochen werden duerfen.
    #
    # "id" ist die area_id aus Home Assistant (Einstellungen → Bereiche & Zonen; meist der
    # kleingeschriebene Name). Sie ist immer auch ein gueltiger Name und muss unter "names" nicht
    # wiederholt werden - dort stehen nur Bezeichnungen, die davon abweichen.
    #
    # Gross-/Kleinschreibung, Bindestriche und die Schreibweise von Umlauten sind egal: "Büro",
    # "buero" und "BÜRO" finden denselben Eintrag.
    areas:
      - id: wohnzimmer
        names: [Wohnzimmer, Stube]
      - id: kueche
        names: [Küche]
      - id: schlafzimmer
        names: [Schlafzimmer]
      # In Home Assistant heisst der Bereich "Arbeitszimmer", gesprochen wird er "Büro".
      - id: arbeitszimmer
        names: [Arbeitszimmer, Büro]
